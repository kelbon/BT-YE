name: build_and_test

'on':
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' || !github.ref }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc-14, clang-20]
        build_type: [Debug, Release]
        sanitize: ['']
        include:
          - compiler: clang-20
            build_type: Debug
            sanitize: address,undefined
          - compiler: clang-20
            build_type: Debug
            sanitize: thread
    runs-on: ubuntu-24.04
    name: ${{ matrix.compiler }} ${{ matrix.build_type }} ${{ matrix.sanitize }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-14
          if [[ "${{ matrix.compiler }}" == clang-20 ]]; then
            wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 20
          fi

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: "v0.10.0"

      - name: Configure CMake
        run: |
          cmake . -B build -G Ninja \
            -Dbtye_ENABLE_TESTING=ON \
            -Dbtye_SANITIZE=${{ matrix.sanitize }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_C_COMPILER=${{ matrix.compiler }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler == 'gcc-14' && 'g++-14' || 'clang++-20' }} \
            -DCMAKE_CXX_STANDARD=23 \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
